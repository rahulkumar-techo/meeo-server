services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: meeo-api
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=5000
      - HOST=0.0.0.0
    env_file:
      - path: .env
        required: false
    ports:
      - "5000:5000"
    expose:
      - "5000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - app-network

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: meeo-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - app-network

  prometheus:
    image: prom/prometheus:v3.2.1
    container_name: meeo-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      api:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    secrets:
      - grafana_cloud_token
    networks:
      - app-network

  promtail:
    image: grafana/promtail:3.3.2
    container_name: meeo-promtail
    restart: unless-stopped
    user: "root"
    command:
      - "-config.file=/etc/promtail/promtail-config.yml"
      - "-config.expand-env=true"
    environment:
      - LOKI_URL=${LOKI_URL}
      - LOKI_USER_ID=${LOKI_USER_ID}
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      api:
        condition: service_healthy
    secrets:
      - grafana_loki_token
    networks:
      - app-network

volumes:
  prometheus-data:

networks:
  app-network:
    driver: bridge

secrets:
  grafana_cloud_token:
    environment: GRAFANA_CLOUD_TOKEN
  grafana_loki_token:
    environment: GRAFANA_LOKI_TOKEN



