server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: info

positions:
  filename: /tmp/positions.yaml

clients:
  - url: ${LOKI_URL}
    basic_auth:
      username: ${LOKI_USER_ID}
      password_file: /run/secrets/grafana_loki_token

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # Exclude promtail itself to prevent log loop
      - source_labels: ['__meta_docker_container_name']
        regex: '/.*promtail.*'
        action: drop
      # Set clean container and job labels, plus service/pod/app for dashboard compatibility
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'job'
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'service'
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'pod'
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'app'
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: 'stream'
