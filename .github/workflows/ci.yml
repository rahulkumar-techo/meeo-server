name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Prisma config needs a parseable URL for client generation; no database connection is made.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm ci uses the committed lockfile for reproducible CI installs.
      - name: Install dependencies
        run: npm ci

      # Keep local pre-push verification and CI on the same command sequence.
      - name: Generate, typecheck, test, and build
        run: npm run ci:verify